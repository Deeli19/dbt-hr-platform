name: dbt Production Deploy

# One-time code deployment. Source-data changes use dbt_prod_run.yml.
# Runs against the reviewed main branch and uploads the production manifest
# used for state comparison in pull-request Slim CI.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Both production workflows use this group to avoid concurrent warehouse writes.
concurrency:
  group: hr-production-warehouse
  cancel-in-progress: false

jobs:

  dbt-prod:
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: dbt deps
        run: |
          dbt deps

      - name: Setup Production Profile
        run: |
          mkdir -p /home/runner/.dbt

          printf '%s' "${{ secrets.PROD_PRIVATE_KEY_PATH }}" > /home/runner/.dbt/rsa_key.p8

          chmod 600 /home/runner/.dbt/rsa_key.p8

          cat > /home/runner/.dbt/profiles.yml <<EOF
          default:
            target: prod

            outputs:

              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.PROD_USER }}
                role: ${{ secrets.PROD_ROLE }}
                warehouse: PROD_WH
                database: PRODUCTION
                schema: HR
                threads: 8
                private_key_path: /home/runner/.dbt/rsa_key.p8
                private_key_passphrase: "${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}"
          EOF

      - name: Validate connection
        run: |
          dbt debug --target prod

      # For dbt Core, deploying model code requires executing it in the warehouse.
      # This is a one-off production build on approved code changes; the
      # separate scheduled workflow keeps business data current afterward.
      - name: Run production build
        run: |
          dbt build --target prod

      - name: Compile
        run: dbt compile --target prod

      - name: Upload manifest
        uses: actions/upload-artifact@v4

        with:
          name: manifest-artifact
          path: target/manifest.json
